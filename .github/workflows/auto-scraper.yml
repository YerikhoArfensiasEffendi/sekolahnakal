name: Discord Scraper & ZeroStorage Auto-Publisher

on:
  schedule:
    # Otomatis berjalan setiap jam (24/7 di cloud) untuk menyedot seluruh arsip 6.800+ video
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batas video per channel per batch (default 50)'
        required: false
        default: '50'

jobs:
  parallel-category-scraper:
    name: "Scraper - Group: ${{ matrix.group }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - reguler
          - vip-asia-east
          - vip-lokal-asia
          - vip-global

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl

      - name: Run Discord Scraper for ${{ matrix.group }}
        run: |
          python scripts/auto_scraper_discord.py --group ${{ matrix.group }} --limit ${{ github.event.inputs.limit || '30' }}
        env:
          PYTHONUNBUFFERED: "1"

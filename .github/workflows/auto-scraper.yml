name: Discord Scraper & ZeroStorage Auto-Publisher

on:
  schedule:
    # Otomatis berjalan setiap 2 jam (24/7 di cloud)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Bisa juga ditekan manual kapan saja dari web GitHub

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl

      - name: Run Discord Scraper & ZeroStorage Auto-Publisher
        run: |
          python scripts/auto_scraper_discord.py
        env:
          PYTHONUNBUFFERED: "1"
